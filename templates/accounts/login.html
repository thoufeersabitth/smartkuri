{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartKuri - Create Account</title>

    <!-- 🔥 FAVICON FULL SETUP -->
    <link rel="icon" type="image/x-icon" href="{% static 'images/favicon.ico' %}">
    <link rel="shortcut icon" href="{% static 'images/favicon.ico' %}">

    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'images/favicon-32x32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'images/favicon-16x16.png' %}">
    
    <link rel="apple-touch-icon" href="{% static 'images/apple-touch-icon.png' %}">
    <link rel="manifest" href="{% static 'images/site.webmanifest' %}">

    <meta name="theme-color" content="#4f46e5">

    <!-- STYLES -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'accounts/css/login.css' %}">
</head>
<body>

    <div class="auth-page-bg"></div>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo-circle">
                    <i class="fas fa-wallet"></i>
                </div>
                <h1>SmartKuri</h1>
                <p>Modern Chitty Management</p>
            </div>

            <h2>Welcome Back</h2>

            {% if messages %}
                <div class="messages">
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags|default:'info' }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}

            <form method="POST" action="{% url 'accounts:login' %}">
                {% csrf_token %}

                <div class="form-floating-group">
                    <input 
                        type="text" 
                        id="identifier" 
                        name="identifier" 
                        placeholder=" " 
                        required 
                        autofocus
                    >
                    <label for="identifier">Email or Phone Number</label>
                </div>

                <div id="kuri_group_wrapper" class="form-floating-group" style="display: none; margin-bottom: 20px;">
                    <select id="kuri_id" name="kuri_id" class="form-control" style="width: 100%; padding: 12px 16px; border-radius: 10px; border: 1px solid #cbd5e1; background: #ffffff; color: #1e293b; font-size: 14px; font-weight: 500; appearance: auto; cursor: pointer;">
                        <option value="">-- Select Kuri Group --</option>
                    </select>
                </div>

                <div class="form-floating-group password-group">
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder=" " 
                        required
                    >
                    <label for="password">Password</label>
                    <span class="toggle-password" onclick="togglePassword()">
                        <i class="fas fa-eye"></i>
                    </span>
                </div>

                <button type="submit" class="btn-gradient">
                    <span>Sign In</span>
                    <i class="fas fa-arrow-right-to-bracket"></i>
                </button>
            </form>

            <div class="extra-links">
                <a href="{% url 'core:home' %}" class="back-home-link">
                    <i class="fas fa-home"></i> Back to Home
                </a>

                <a href="{% url 'accounts:password_reset' %}" class="forgot-link">
                    Forgot your password?
                </a>

                <p class="signup-text">
                    New to SmartKuri? 
                    <a href="{% url 'accounts:group_signup' %}" class="signup-link">Create Account</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.querySelector('.toggle-password i');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        // 🔄 Dynamic Kuri & Multi-Role Selection (Hidden by default for pure Group Admins)
        document.getElementById('identifier').addEventListener('input', function() {
            const identifier = this.value.trim();
            const kuriWrapper = document.getElementById('kuri_group_wrapper');
            const kuriSelect = document.getElementById('kuri_id');

            if (identifier.length >= 3) {
                fetch("{% url 'accounts:get_user_kuris' %}?identifier=" + encodeURIComponent(identifier))
                    .then(res => res.json())
                    .then(data => {
                        if (data.show_kuri_select) {
                            kuriSelect.innerHTML = '';
                            const defaultOpt = document.createElement('option');
                            defaultOpt.value = '';
                            defaultOpt.textContent = '-- Select Login Role / Kuri Group --';
                            kuriSelect.appendChild(defaultOpt);

                            // 👑 If user is also a Group Admin
                            if (data.has_admin_role) {
                                const adminOpt = document.createElement('option');
                                adminOpt.value = 'admin_portal';
                                adminOpt.textContent = '👑 Group Admin Dashboard (Admin Portal)';
                                adminOpt.style.fontWeight = 'bold';
                                adminOpt.style.color = '#4f46e5';
                                kuriSelect.appendChild(adminOpt);
                            }

                            // 💵 If user has Collector access
                            if (data.has_collector_role) {
                                const colOpt = document.createElement('option');
                                colOpt.value = 'collector_portal';
                                colOpt.textContent = '💵 Cash Collector Portal';
                                colOpt.style.fontWeight = 'bold';
                                colOpt.style.color = '#059669';
                                kuriSelect.appendChild(colOpt);
                            }

                            // 💳 Member Kuris List
                            if (data.kuris && data.kuris.length > 0) {
                                data.kuris.forEach(kuri => {
                                    const opt = document.createElement('option');
                                    opt.value = kuri.id;
                                    opt.textContent = `💳 ${kuri.name} (${kuri.code})`;
                                    kuriSelect.appendChild(opt);
                                });
                            }

                            kuriWrapper.style.display = 'block'; // Show dropdown for multi-role / multi-kuri users
                        } else {
                            kuriSelect.innerHTML = '';
                            kuriWrapper.style.display = 'none';
                        }
                    })
                    .catch(err => {
                        console.error("Error loading Kuri groups:", err);
                        kuriWrapper.style.display = 'none';
                    });
            } else {
                kuriWrapper.style.display = 'none';
            }
        });
    </script>

</body>
</html>
